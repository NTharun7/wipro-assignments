<!DOCTYPE html>
<html>
<head>
    <title>Online Conferences Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
        }
        .form-container {
            width: 500px;
            margin: auto;
            border: 2px solid #000;
            padding: 20px;
        }
        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 8px;
            vertical-align: top;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 250px;
            padding: 4px;
            margin-bottom: 8px;
        }
        textarea {
            height: 50px;
        }
        .inline {
            display: inline-block;
            width: auto;
            margin-right: 10px;
        }
        .section-title {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .expiry-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>ONLINE CONFERENCES REGISTRATION FORM</h2>

<div class="form-container">
    <div class="section-title">Personal Information</div>
    <label>Full Name</label>
    <input type="text"><br>

    <label>Email Address</label>
    <input type="email"><br>
    <label></label>
    <small>format: user@example.com</small><br>

    <label>Gender</label>
    <input type="radio" name="gender" class="inline"> Male
    <input type="radio" name="gender" class="inline"> Female<br>

    <label>Country</label>
    <select>
        <option>--Select--</option>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Australia</option>
    </select><br>

    <label>Profile Photo Upload</label>
    <input type="file"><br>

    <div class="section-title">Account Preferences</div>
    <label>Username</label>
    <input type="text"><br>

    <label>Password</label>
    <input type="password"><br>

    <label>Confirm Password</label>
    <input type="password"><br>

    <label>Interests</label>
    <input type="checkbox" class="inline"> Web Development
    <input type="checkbox" class="inline"> AI
    <input type="checkbox" class="inline"> Cloud<br>

    <label>Preferred Contact Method</label>
    <input type="radio" name="contact" class="inline"> Email
    <input type="radio" name="contact" class="inline"> Phone<br>

    <label>Special Requirements / Comments</label>
    <textarea></textarea><br>

    <div class="section-title">Payment Details</div>
    <label>Payment Method</label>
    <select>
        <option>--Select--</option>
        <option>Credit Card</option>
        <option>Debit Card</option>
        <option>Net Banking</option>
    </select><br>

    <label>Card Number</label>
    <input type="text"><br>

    <label>Expiry Date</label>
    <div class="expiry-container">
        <select>
            <option>Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>
        <select>
            <option>Year</option>
            <option>2025</option>
            <option>2026</option>
            <option>2027</option>
            <option>2028</option>
        </select>
    </div><br>

    <label>CVV</label>
    <input type="text" style="width:50px;"><br>

    <label>Terms & Conditions</label>
    <input type="checkbox" class="inline"> I agree to Terms<br>

    <div class="buttons">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </div>
</div>

</body>
</html>
