<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Client</title>
</head>
<body>
    <h2>Edit Client</h2>
    <form th:action="@{/clients/update/{id}(id=${client.id})}" th:object="${client}" method="post">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required />
        <br/>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required />
        <br/>
        <button type="submit">Update</button>
    </form>
    <br/>
    <a th:href="@{/clients}">Back to List</a>
</body>
</html>
