<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client List</title>
</head>
<body>
    <h2>Clients</h2>

    <a th:href="@{/clients/new}">Add New Client</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th> <!-- Add this -->
            <th>Actions</th>
        </tr>
        <tr th:each="client : ${clients}">
            <td th:text="${client.id}"></td>
            <td th:text="${client.name}"></td>
            <td th:text="${client.email}"></td>
            <td th:text="${client.phone}"></td> <!-- Add this -->
            <td>
                <a th:href="@{/clients/edit/{id}(id=${client.id})}">Edit</a> |
                <a th:href="@{/clients/delete/{id}(id=${client.id})}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
    </table>
</body>
</html>
