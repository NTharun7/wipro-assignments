spring.application.name=onlineshopping

# -----------------------------
# Server Config
# -----------------------------
server.port=8080
server.servlet.context-path=/api

# -----------------------------
# MySQL Database Config
# -----------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/onlineshopping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Nut5823@

# -----------------------------
# Hibernate / JPA Config
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# -----------------------------
# JWT Config
# -----------------------------
# Secret key (\u26A0 in production: use long random string, keep it safe)
app.jwtSecret=MyCapstoneSecretKeyForJWT1234567890
# Token validity = 24 hours
app.jwtExpirationMs=86400000

# -----------------------------
# Swagger / OpenAPI Config
# -----------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
