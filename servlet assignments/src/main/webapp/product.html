<!DOCTYPE html>
<html>
<head>
    <title>Select Product</title>
</head>
<body>
    <h2>Select a Product</h2>
    <form action="product" method="post">
        <label>Select a product:</label>
        <select name="product">
            <option value="Laptop-50000">Laptop - ₹50,000</option>
            <option value="Phone-30000">Phone - ₹30,000</option>
            <option value="Headphones-2000">Headphones - ₹2,000</option>
        </select>
        <br><br>
        <input type="submit" value="Next">
    </form>
</body>
</html>
