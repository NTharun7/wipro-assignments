<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Grocery Order</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{max-width:900px;margin:2rem auto;padding:1rem;background:#f8f9fb;color:#222}
    h2{text-align:center;margin-bottom:0.5rem}
    form{background:#fff;padding:1.25rem;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,50,.06)}
    fieldset{border:1px solid #e3e8ef;padding:1rem;border-radius:6px;margin:0 0 1rem}
    legend{font-weight:600;padding:0 .5rem}
    .row{display:flex;gap:1rem;flex-wrap:wrap}
    .col{flex:1;min-width:220px}
    label{display:block;font-size:.95rem;margin-bottom:.25rem}
    input[type="text"],input[type="email"],input[type="tel"],input[type="number"],input[type="date"],input[type="time"],textarea,select{
      width:100%;padding:.5rem;border:1px solid #d6dbe6;border-radius:6px;font-size:1rem;box-sizing:border-box}
    .checkbox-group,.radio-group{display:flex;flex-direction:column;gap:.25rem}
    .controls{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:.5rem}
    button{padding:.55rem .9rem;border-radius:6px;border:0;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    button[type="reset"]{background:#6b7280}
    small{color:#555}
  </style>
</head>
<body>
  <h2>Online Grocery Order</h2>

  <form action="order.php" method="POST">

    <fieldset>
      <legend>Customer Details</legend>

      <div class="row">
        <div class="col">
          <label for="fullname">Full Name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" required autofocus>
        </div>

        <div class="col">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="mobile">Mobile Number <small>(10 digits)</small></label>
          <input id="mobile" name="mobile" type="tel" pattern="[0-9]{10}" placeholder="9876543210" required title="Enter exactly 10 digits">
        </div>

        <div class="col">
          <label for="address">Delivery Address</label>
          <textarea id="address" name="address" rows="3" placeholder="House number, street, city, ZIP" required></textarea>
        </div>
      </div>

    </fieldset>

    <fieldset>
      <legend>Order Details</legend>

      <div>
        <label>Grocery Items <small>(select one or more)</small></label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="groceries[]" value="Rice"> Rice</label>
          <label><input type="checkbox" name="groceries[]" value="Milk"> Milk</label>
          <label><input type="checkbox" name="groceries[]" value="Bread"> Bread</label>
          <label><input type="checkbox" name="groceries[]" value="Eggs"> Eggs</label>
          <label><input type="checkbox" name="groceries[]" value="Sugar"> Sugar</label>
        </div>
      </div>

      <div class="row" style="margin-top:0.75rem">
        <div class="col">
          <label for="quantity">Quantity</label>
          <input id="quantity" name="quantity" type="number" min="1" max="10" value="1" required>
        </div>

        <div class="col">
          <label for="delivery-date">Delivery Date</label>
          <input id="delivery-date" name="delivery_date" type="date" required>
        </div>

        <div class="col">
          <label for="delivery-time">Preferred Delivery Time</label>
          <input id="delivery-time" name="delivery_time" type="time">
        </div>
      </div>

      <div style="margin-top:0.75rem">
        <label>Payment Method</label>
        <div class="radio-group">
          <label><input type="radio" name="payment" value="cod" required> Cash on Delivery</label>
          <label><input type="radio" name="payment" value="upi"> UPI</label>
          <label><input type="radio" name="payment" value="card"> Card</label>
        </div>
      </div>

      <div style="margin-top:0.75rem">
        <label for="instructions">Special Instructions (optional)</label>
        <textarea id="instructions" name="instructions" rows="3" placeholder="Any delivery notes, e.g., 'Leave at gate'. (optional)"></textarea>
      </div>

    </fieldset>

    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem">
      <input id="confirm" name="confirm" type="checkbox" required>
      <label for="confirm">I confirm my order</label>
    </div>

    <div class="controls">
      <button type="submit">Submit Order</button>
      <button type="reset">Reset</button>
    </div>

  </form>

</body>
</html>
